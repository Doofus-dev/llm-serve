# models.conf — model profiles for llm-serve
#
# Copy this file to `models.conf` and edit it for your setup.
# Every parameter is documented below.
#
# ═══════════════════════════════════════════════════════════════════════════════
# QUICK START
# ═══════════════════════════════════════════════════════════════════════════════
#
# 1. Copy this file:
#    cp models.conf.example models.conf
#
# 2. Edit the `file=` paths to match where your GGUF models actually live.
#
# 3. Adjust `gpu_layers`, `ctx`, and KV cache settings for your hardware.
#
# 4. Launch: ./llm-serve <profile-name>
#
# ═══════════════════════════════════════════════════════════════════════════════
# ALIAS EXAMPLES
# ═══════════════════════════════════════════════════════════════════════════════
#
# Aliases let you use friendly names instead of typing the full profile name:
#   ./llm-serve coding   → launches whatever profile the "coding" alias points to

register_alias default my-model    # your everyday primary model
register_alias coding my-coder     # your coding model

# ── Hermes config defaults (OPTIONAL — only needed if you use Hermes Agent) ──
HERMES_DEFAULT_MAX_TURNS=150
HERMES_DEFAULT_TEMP=0.8
HERMES_DEFAULT_TOP_P=0.95
HERMES_DEFAULT_TOP_K=40
HERMES_DEFAULT_MIN_P=0.05
HERMES_DEFAULT_SEED=-1
HERMES_DEFAULT_TOOL_USE_ENFORCEMENT=false
HERMES_DEFAULT_COMPRESSION_ENABLED=true
HERMES_DEFAULT_COMPRESSION_THRESHOLD=0.85
HERMES_DEFAULT_API_MAX_RETRIES=3
HERMES_DEFAULT_SYNC_AUX=1

# ── Model directory ──────────────────────────────────────────────────────────
# Base directory where all your .gguf model files live.
# Each model's `file=` parameter is resolved relative to this.
# Override at runtime: MODEL_DIR=/path/to/your/models llm-serve my-model
# Leave empty (default) for the `models/` folder at repo root.
# MODEL_DIR=

# ── Parameter reference ───────────────────────────────────────────────────────
#
#   file
#     The filename of the GGUF model inside the `models/` directory at the
#     repo root (or wherever your MODEL_PATH points). Override at runtime:
#     MODEL_PATH=/path/to/model.gguf
#
#   port
#     HTTP port for the server. Default 8081. Override: PORT=9000
#
#   total_layers
#     Total transformer layers in the model (fixed by architecture). Used for
#     the startup banner sanity check.
#     Examples: Llama 3 8B = 32, Qwen 14B = 40, Qwen 32B = 64.
#
#   gpu_layers
#     Layers to offload to GPU. 99 = all layers (llama-server clamps to total).
#     Fewer = less VRAM used but slower. Override: GPU_LAYERS=50
#
#   n_cpu_moe   (MoE models only — leave empty for dense models)
#     Offload expert (FFN) tensors of the first N layers to CPU RAM. Keeps
#     attention layers on GPU. Critical for fitting large MoE models on
#     consumer GPUs. Requires a recent llama.cpp build with --n-cpu-moe support.
#     Tuning: start at total_layers, then lower while watching nvidia-smi.
#
#   ctx
#     Context window size in tokens. Larger = more VRAM for KV cache.
#     Common: 32768, 65536, 131072. Override: CONTEXT_SIZE=65536
#
#   cache_k / cache_v
#     KV cache quantization (f16, q8_0, q4_0). Controls VRAM usage and speed.
#     q4_0/q4_0 = smallest, fastest on memory-bound workloads.
#     q8_0/q4_0 = textbook compromise (sharp keys, smaller values).
#     Omit both → defaults to q4_0/q4_0.
#     Override: CACHE_TYPE_K=q8_0 CACHE_TYPE_V=q8_0
#
#   batch / ubatch
#     Prompt processing batch size and micro-batch kernel size.
#     Larger batch = faster prefill but more peak VRAM.
#     ubatch matters for large-vocab models (Gemma needs ubatch=128).
#     Override: BATCH_SIZE=2048 UBATCH=256
#
#   threads
#     CPU threads for non-GPU layers. Override: THREADS=8
#
#   parallel
#     Simultaneous conversation slots. 1 for personal use.
#     Raises this → splits ctx across slots. Override: PARALLEL=2
#
#   n_predict
#     Max tokens per reply. Safety cap. Override: N_PREDICT=8192
#
#   defrag
#     KV cache defrag threshold (0.0-1.0). 0.1 = compact at 10% fragmentation.
#     Override: DEFRAG_THOLD=0.1
#
#   thinking
#     "off" to disable chain-of-thought for Qwen3/Gemma3 models.
#     "on" to enable. Leave empty for models without thinking mode.
#
#   mtp
#     "1" to enable Multi-Token Prediction (speculative decoding).
#     "0" for models that don't support it.
#
#   per_slot_min
#     Minimum ctx tokens per parallel slot. Set to 0 to skip the check.
#
#   notes
#     One-line description shown in the model listing.
#
#   host
#     Bind address (default 127.0.0.1). Override: HOST=0.0.0.0
#
# ═══════════════════════════════════════════════════════════════════════════════
# SERVER RUNTIME PARAMETERS
# ═══════════════════════════════════════════════════════════════════════════════
#
#   flash_attn        Flash attention: on | off | auto. Default on.
#   checkpoint_every  Prefill checkpoint interval (-1 = disabled). Default -1.
#   jinja             Jinja chat template: on | off. Default on (required for tools).
#   threads_batch     CPU threads for batch/prefill. Empty = same as --threads.
#   timeout           Server read/write timeout (seconds). Default 600.
#   cache_prompt      Prompt caching: on | off. Default on.
#   cache_reuse       Min chunk for KV cache reuse. Default 0 (disabled).
#   cont_batching     Continuous batching: on | off. Default on.
#   ctx_checkpoints   Max checkpoints per slot. Empty = llama-server default (32).
#   reasoning_format  Thinking tag parser: none | deepseek | deepseek-legacy | auto.
#   reasoning_budget  Token budget for thinking (-1 = unlimited, 0 = off).
#   spec_draft_n_max  MTP speculative draft depth max.
#   spec_draft_n_min  MTP speculative draft depth min.
#
# ═══════════════════════════════════════════════════════════════════════════════
# SAMPLING DEFAULTS
# ═══════════════════════════════════════════════════════════════════════════════
#
#   temp              Temperature (creativity). Default 0.8.
#   top_p             Nucleus sampling. Default 0.95.
#   top_k             Top-k sampling. Default 40.
#   min_p             Min-P sampling. Default 0.05.
#   seed              Random seed (-1 = random). Default -1.
#   repeat_penalty    Repetition penalty. Default 1.0.
#   repeat_last_n     Tokens to check for repetition. Default 64.
#   presence_penalty  Presence penalty. Default 0.0.
#   frequency_penalty Frequency penalty. Default 0.0.
#
# ═══════════════════════════════════════════════════════════════════════════════
# HERMES AGENT BEHAVIOR (optional — only if you use Hermes Agent)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   tool_use_enforcement  auto | true | false. Default false.
#   compression_enabled   Context compression on/off. Default true.
#   compression_threshold Compress at N% context. Default 0.85.
#   api_max_retries       Retries before fallback. Default 3.
#   sync_aux              Point aux/delegation at main model. Default 1.
#
# ═══════════════════════════════════════════════════════════════════════════════
# FIXED LAYOUT (every model uses this parameter order)
# ═══════════════════════════════════════════════════════════════════════════════
#
#   register_model "<name>" \
#       file="model.gguf" \
#       port=8081 \
#       host=127.0.0.1 \
#       total_layers=32 \
#       gpu_layers=99 \
#       n_cpu_moe= \
#       ctx=32768 \
#       cache_k=q4_0 \
#       cache_v=q4_0 \
#       batch=2048 \
#       ubatch=256 \
#       threads=8 \
#       parallel=1 \
#       n_predict=8192 \
#       defrag=0.1 \
#       thinking= \
#       mtp=0 \
#       per_slot_min=0 \
#       flash_attn=on \
#       checkpoint_every=-1 \
#       jinja=on \
#       threads_batch= \
#       timeout=600 \
#       cache_prompt=on \
#       cache_reuse=0 \
#       cont_batching=on \
#       ctx_checkpoints= \
#       temp=0.8 \
#       top_p=0.95 \
#       top_k=40 \
#       min_p=0.05 \
#       seed=-1 \
#       repeat_penalty=1.0 \
#       repeat_last_n=64 \
#       presence_penalty=0.0 \
#       frequency_penalty=0.0 \
#       reasoning_format= \
#       reasoning_budget= \
#       spec_draft_n_max=2 \
#       spec_draft_n_min=0 \
#       tool_use_enforcement=false \
#       compression_enabled=true \
#       compression_threshold=0.85 \
#       api_max_retries=3 \
#       sync_aux=1 \
#       notes="Example model"
#
# Use the documented defaults when a parameter doesn't apply. Never omit lines
# or insert comment-only lines between \ continuations (bash drops them).
#
# ═══════════════════════════════════════════════════════════════════════════════
# EXAMPLE MODEL PROFILES
# ═══════════════════════════════════════════════════════════════════════════════

# ── Example: Llama 3.1 8B Instruct (Q4_K_M quant) ────────────────────────────
# A solid general-purpose model. Fits comfortably on 8 GB GPU.
register_model "llama3-8b" \
    file="llama-3.1-8b-instruct-q4_k_m.gguf" \
    port=8081 \
    host=127.0.0.1 \
    total_layers=32 \
    gpu_layers=99 \
    n_cpu_moe= \
    ctx=32768 \
    cache_k=q4_0 \
    cache_v=q4_0 \
    batch=2048 \
    ubatch=256 \
    threads=8 \
    parallel=1 \
    n_predict=8192 \
    defrag=0.1 \
    thinking= \
    mtp=0 \
    per_slot_min=0 \
    flash_attn=on \
    checkpoint_every=-1 \
    jinja=on \
    threads_batch= \
    timeout=600 \
    cache_prompt=on \
    cache_reuse=0 \
    cont_batching=on \
    ctx_checkpoints= \
    temp=0.7 \
    top_p=0.9 \
    top_k=50 \
    min_p=0.05 \
    seed=-1 \
    repeat_penalty=1.1 \
    repeat_last_n=64 \
    presence_penalty=0.0 \
    frequency_penalty=0.0 \
    reasoning_format= \
    reasoning_budget= \
    spec_draft_n_max=2 \
    spec_draft_n_min=0 \
    tool_use_enforcement=false \
    compression_enabled=true \
    compression_threshold=0.85 \
    api_max_retries=3 \
    sync_aux=1 \
    notes="General purpose chat and reasoning"

# ── Example: Qwen3-Coder (MoE, Q4_K_M) ────────────────────────────────────────
# Code-focused MoE model. Uses n_cpu_moe to fit on consumer GPU.
register_model "qwen-coder" \
    file="qwen3-coder-3b-q4_k_m.gguf" \
    port=8081 \
    host=127.0.0.1 \
    total_layers=28 \
    gpu_layers=99 \
    n_cpu_moe=28 \
    ctx=65536 \
    cache_k=q4_0 \
    cache_v=q4_0 \
    batch=2048 \
    ubatch=256 \
    threads=8 \
    parallel=1 \
    n_predict=16384 \
    defrag=0.1 \
    thinking= \
    mtp=0 \
    per_slot_min=0 \
    flash_attn=on \
    checkpoint_every=-1 \
    jinja=on \
    threads_batch= \
    timeout=600 \
    cache_prompt=on \
    cache_reuse=0 \
    cont_batching=on \
    ctx_checkpoints= \
    temp=0.3 \
    top_p=0.9 \
    top_k=50 \
    min_p=0.05 \
    seed=-1 \
    repeat_penalty=1.0 \
    repeat_last_n=64 \
    presence_penalty=0.0 \
    frequency_penalty=0.0 \
    reasoning_format= \
    reasoning_budget= \
    spec_draft_n_max=2 \
    spec_draft_n_min=0 \
    tool_use_enforcement=true \
    compression_enabled=true \
    compression_threshold=0.85 \
    api_max_retries=3 \
    sync_aux=1 \
    notes="MoE coding model with expert offload"

# ── Hermes config for models (OPTIONAL — only if you use Hermes Agent) ────────
#
# register_hermes_config "<profile>" [key=value ...]
#   Auto-derives context_length, model, max_turns, provider, base_url from
#   the register_model entry above. Pass explicit overrides as needed:
#
# register_hermes_config "llama3-8b" \
#     hermes_profile=default \
#     reasoning=off \
#     max_turns=150
#
# register_hermes_config "qwen-coder" \
#     hermes_profile=default \
#     reasoning=off \
#     max_turns=100
