[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-serve"
version = "0.1.0"
description = "Declarative llama.cpp launcher and Textual TUI"
requires-python = ">=3.9"
dependencies = [
    "textual>=0.86",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["tui*"]

[tool.setuptools.package-data]
tui = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
